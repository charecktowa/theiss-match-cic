name: theiss-match-cic

services:
  api:
    build:
      context: ./backend
    init: true
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      # Dev only: mount the source so --reload picks up edits without rebuilding.
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request as u; u.urlopen("http://127.0.0.1:8000/").read()
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
