name: theiss-match-cic

services:
  api:
    build:
      context: ./backend
    init: true
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-theiss}:${POSTGRES_PASSWORD:-theiss}@db:5432/${POSTGRES_DB:-theiss}
    volumes:
      # Dev only: --reload only reads the source, so the mount stays read-only.
      - ./backend/app:/app/app:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request as u; u.urlopen("http://127.0.0.1:8000/").read()
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  db:
    image: pgvector/pgvector:pg16
    init: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-theiss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-theiss}
      POSTGRES_DB: ${POSTGRES_DB:-theiss}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
