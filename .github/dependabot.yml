version: 2
updates:
  # Wait a week before adopting a new release, so a compromised version has time
  # to surface before it reaches this repository.
  - package-ecosystem: "uv"
    # One entry per uv project: Dependabot looks for the lockfile relative to
    # this path, so a single "/" entry would find neither of them.
    # The uv projects live in backend/ and experiments/.
    directory: "/backend"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/experiments"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      experiment-deps:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/scraper"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      scraper-deps:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "pre-commit"
    # Keeps the hook revisions current. They must stay equal to the versions
    # resolved in backend/uv.lock, so these two updates belong together.
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns: ["*"]
