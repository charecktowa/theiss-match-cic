name: CI

on:
  # Branches are checked through their pull request; main again after each merge.
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only read the repository, so do not let them
# inherit a token with write access.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        # The uv project lives in backend/, not at the repository root.
        working-directory: backend
    steps:
      - name: Checkout
        # Pinned to a commit rather than a tag: a tag is mutable, and pinning
        # is what forces the ref to be resolved and verified.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        # astral-sh/setup-uv stopped publishing moving major tags after v7, so
        # @v10 does not resolve at all.
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy .

      - name: Bandit
        run: uv run bandit -r . -x .venv -c pyproject.toml

      - name: Tests
        run: uv run pytest

  # The image must build and pass the tests on its own, without the host's packages.
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build production image
        run: docker compose build

      - name: Build test image with dev dependencies
        run: docker build --build-arg UV_SYNC_ARGS="--group dev" -t theiss-match-cic-api:test ./backend

      - name: Tests inside the image
        run: docker run --rm theiss-match-cic-api:test pytest
