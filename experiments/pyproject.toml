[project]
name = "experiments"
version = "0.1.0"
description = "Notebooks for exploring embedding models and retrieval approaches"
readme = "README.md"
authors = [
    { name = "A. Gutiérrez Alfaro", email = "charecktowa@pm.me" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "marimo>=0.25.1",
    "numpy>=2.5.4",
    "pgvector>=0.5.1",
    "polars>=2.0.0",
    "psycopg[binary]>=3.3.6",
    "sentence-transformers>=6.1.0",
]

[dependency-groups]
dev = [
    "altair>=6.3.0",
    "duckdb>=1.5.6",
    "nbformat>=5.11.1",
    "openai>=3.35.1",
    "polars[pyarrow]>=2.0.0",
    "python-lsp-ruff>=2.3.4",
    "python-lsp-server>=1.15.0",
    "ruff>=0.17.1",
    "sqlglot>=30.23.0",
    "vegafusion>=2.0.3",
    "vl-convert-python>=1.9.0.post1",
    "websockets>=17.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "PD"]

# B018 flags a bare expression as useless, but in a marimo notebook the last
# expression of a cell IS the cell's output, so `df` on its own is idiomatic.
# Do not remove this: the other rules are worth keeping, and F821 in particular
# catches a real marimo mistake, a cell using a name it never received.
ignore = ["B018"]
