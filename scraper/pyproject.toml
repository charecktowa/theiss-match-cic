[project]
name = "cic-scraper"
version = "0.1.0"
description = "One-off CIC web capture, catalog export and SABER comparison"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "PD"]
