[project]
name = "cic-scraper"
version = "0.1.0"
description = "One-off CIC web capture, catalog export and SABER comparison"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "PD"]

[tool.pytest.ini_options]
# The scripts are run as files, not installed, so tests import them from here.
pythonpath = ["."]
testpaths = ["tests"]
